# Mirrors the pwdsafe deployment (ESolutions.PwdSafe/.github/workflows/master_pwdsafe-web.yml):
# build on push to master, then OIDC login + legacy zipdeploy to the App Service.

name: Build and deploy ASP.Net Core app to Azure Web App - mitsubishipajero-web

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet publish
        run: dotnet publish MitsubishiPajero/MitsubishiPajero.csproj -c Release -o "${{ github.workspace }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # These are non-secret identifiers; auth is OIDC via the federated credential
      # "github-pajero-master" on the managed identity oidc-msi-9293 (live-websites),
      # which only trusts refs/heads/master of this repository.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: 2b0a8f96-04fb-4eaf-b606-00865bbdbc94
          tenant-id: 55ba7fbc-c987-4088-b82a-e29ae8245c2f
          subscription-id: be77bdeb-4241-4bf0-a65e-2562ff53d2b9

      # Legacy zipdeploy API on purpose — OneDeploy (azure/webapps-deploy, az webapp deploy)
      # answers 503 on these apps (same quirk as pwdsafe-web).
      - name: Deploy to Azure Web App
        run: |
          zip -qr deploy.zip .
          az webapp deployment source config-zip --name mitsubishipajero-web --resource-group live-websites --src deploy.zip
